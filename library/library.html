<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Small library application</title>
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: system-ui, Arial, sans-serif;
            margin: 0;
            padding: 2rem;
            background: #f1f5f9;
            color: #1e293b;
        }

        h1 { margin-top: 0; }

        /* ---------- FORM ---------- */
        form {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            background: white;
            padding: 16px;
            border-radius: 10px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
        }
        form input[type="text"],
        form input[type="number"] {
            flex: 1 1 160px;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font: inherit;
        }
        form label { display: flex; align-items: center; gap: 6px; flex: 1;}
        form button {
            margin-left: auto;
            padding: 10px 22px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }
        form button:hover { background: #1d4ed8; }

        /* ---------- THE CONTAINER ----------
           auto-fill + minmax: the browser fits as many 220px+ columns as it can,
           wraps new cards onto new rows, and the container grows taller by itself. 
        */

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }
 
        .card {
            background: white;
            border-left: 6px solid #f59e0b;
            border-radius: 8px;
            padding: 24px 18px;
            font-size: 1.1rem;
            font-weight: 600;
            box-shadow: 0 1px 4px rgba(0,0,0,0.12);
            overflow-wrap: anywhere;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .delete {
            align-self: flex-end;   /* push to the right */
            margin-top: auto;       /* push to the bottom */
            padding: 6px 14px;
            border: 1px solid #fca5a5;
            border-radius: 6px;
            background: white;
            color: #dc2626;
            font: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }
        .delete:hover { background: #dc2626; color: white; }
    </style>
</head>
<body>
    <h1>My Library</h1>
    <form>
        <label for="item">
            <input type="text" name="item" id="item" placeholder="Add a new book"></input>
        </label>
        <button type="submit" id="add-item">Add the book</button>
    </form>
    <div class="container"></div>
    <script>
        const input = document.querySelector('input');
        const button = document.querySelector('button');
        const container = document.querySelector('.container');

        const myLibrary = [];

        function Book(title) {
            this.title = title;
            this.id = crypto.randomUUID();
        }

        function addBookToLibrary(item) {
            const newBook = new Book(item);
            myLibrary.push = newBook;
            createCard(newBook);
        }

        function createCard(item) {
            const card = document.createElement("div");
            card.classList.add('card');
            const title = document.createElement("span");
            title.textContent = item.title;
            const deleteButton = document.createElement("button");
            deleteButton.classList.add('delete');
            deleteButton.textContent = "Delete";
            deleteButton.addEventListener('click', () => {
                const index = myLibrary.findIndex(b => b.id === item.id);
                myLibrary.splice(index, 1);
                card.remove();
            })
            card.append(title, deleteButton);
            container.appendChild(card);
        }

        button.addEventListener('click', (e) => {
            e.preventDefault();
            const inputValue = input.value.trim();
            input.focus();
            if (inputValue === "") return;
            input.value = "";
            addBookToLibrary(inputValue);
        })
    </script>
</body>
</html>
