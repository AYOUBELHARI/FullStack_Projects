<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <style>
        * {box-sizing: border-box;}

        body {
            background-image: url('./228362216-hand-drawn-tic-tac-toe-game-with-winning-game-crossed-out-on-foggy-glass-on-blue-window.jpg');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            height: 100vh;
            margin: auto;
            padding: 2rem;
            text-align: center;
            display: flex;
        }

        .game-box {
            width: 40vw;
            aspect-ratio: 1;
            border: 0;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 4px;
        }
        .cell {
            background-color: rgba(146, 151, 156, 0.573);
            border-radius: 14px;
            box-shadow: 14px 14px 8px rgba(0,0,0,0.12);
            overflow: auto;
        }
        .cell { display: grid; place-items: center; }
        .cell svg { width: 60%; height: 60%; }
        .cell[data-mark="X"] { color: #7d0202; }
        .cell[data-mark="O"] { color: #041942; }
        .cell:hover {
            cursor: pointer;
            box-shadow: 1px 1px 4px rgba(0,0,0,0.12);
        }

        .stats-box {
            background-color: rgba(146, 151, 156, 0.573);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            color: rgb(46, 50, 53);
            margin-left: auto;
            width: 40vw;
            aspect-ratio: 1;
            border: 0;
            border-radius: 14px;
            box-shadow: 14px 14px 8px rgba(0,0,0,0.12);
            display: grid;
            grid-template: 1fr 1fr 1fr 1fr / 1fr 1fr;
            gap: 4px;
            overflow-wrap: normal;
        }
        .inputs {
            grid-area: 1 / 1 / 2 / 3;
            margin: 10px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-evenly;
            align-items: center;
        }
        input,
        button {
            background-color: aliceblue;
            color: rgb(46, 50, 53);
            height: 40px;
            text-align: center;
            margin: 8px;
            border: 0;
            border-radius: 32px;
            box-shadow: 14px 14px 8px rgba(0,0,0,0.12);
            width: 160px;
            font-size: 24px;
            outline: none;
        }
        button {
            background-color: rgb(46, 50, 53);
            width: 110px;
            color: aliceblue;
            cursor: pointer;
        }
        button:hover {
            box-shadow: 1px 1px 4px rgba(0,0,0,0.12);
            background-color: aliceblue ;
            color: rgb(46, 50, 53);
        }
        .Score,
        h1 {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            text-align: center;
            flex-wrap: wrap;
            font-size: 48px;
        }
        .again-score {
            grid-area: 2 / 1 / 3 / 3;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .again-score svg {
            position: relative;
            top: 4px;
        }
        .again-score svg:hover {color: red;}
        .Reset {grid-area: 4 / 1 / 5 / 3;}
        .Reset:hover {
            cursor: pointer;
            color: red;
        }
        .p1.Score {
            color: #7d0202;
            grid-area: 3 / 1 / 4 / 2;
        }
        .p2.Score {
            color: #041942;
            grid-area: 3 / 2 / 4 / 3;
        }

    </style>
</head>
<body>
    <div class="game-box"></div>
    <div class="stats-box">
        <form class="inputs">
            <input type="text" class="player1" name="player1" placeholder="Player1"></input>
            <input type="text" class="player2" name="player2" placeholder="Player2"></input>
            <button type="submit">PLAY</button>
        </form>
        <div class="again-score">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                <path d="M3 3v5h5"/>
            </svg>
            <h1 class="score">Score:</h1>
        </div>
        <div class="p1 Score"><span class="name">Player1</span><span class="scoreSpan">0</span></div>
        <div class="p2 Score"><span class="name">Player2</span><span class="scoreSpan">0</span></div>
        <h1 class="Reset">Reset</h1>
    </div>
    <script>
        const X_ICON = `
        <svg viewBox="0 0 100 100" fill="none" stroke="currentColor"
             stroke-width="12" stroke-linecap="round">
          <path d="M22 22L78 78M78 22L22 78"/>
        </svg>`;
        const O_ICON = `
        <svg viewBox="0 0 100 100" fill="none" stroke="currentColor"
             stroke-width="12">
          <circle cx="50" cy="50" r="30"/>
        </svg>`;
        const gameBox = document.querySelector('.game-box')
        const statsBox = document.querySelector('.stats-box')
        const heading = statsBox.querySelector('h1')
        const p1ScoreEl = statsBox.querySelector('.p1 .scoreSpan')
        const p2ScoreEl = statsBox.querySelector('.p2 .scoreSpan')
        const reset = document.querySelector('.Reset')
        reset.addEventListener('click', () => {
            resetBoard()
        })
        const player1Input = document.querySelector('.player1')
        const player2Input = document.querySelector('.player2')
        const player1 = document.querySelector('.p1 .name')
        const player2 = document.querySelector('.p2 .name')
        const submit = document.querySelector('button')
        submit.addEventListener('click', (e) => {
            e.preventDefault()
            const name1 = player1Input.value.trim()
            player1Input.value = ''
            const name2 = player2Input.value.trim()
            player2Input.value = ''
            if (name1) player1.textContent = name1
            if (name2) player2.textContent = name2
        })
        const scoreReset = document.querySelector('.again-score svg')
        scoreReset.addEventListener('click', () => {
            player1.textContent = 'Player1'
            player2.textContent = 'Player2'
            p1Score = 0;
            p2Score = 0;
            updateScore()
        })
 
        // the 8 ways to win, as indexes into the cells array (0..8)
        const WINNING_LINES = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8],   // rows
            [0, 3, 6], [1, 4, 7], [2, 5, 8],   // columns
            [0, 4, 8], [2, 4, 6]               // diagonals
        ];
 
        const cells = [];          // the 9 cell elements, in board order
        let p1Score = 0;
        let p2Score = 0;
        let currentPlayer = 'X';
        let gameOver = false;

        const createElement = (type, id) => {
            const el = document.createElement(type);   // const, not this.el
            el.classList.add('cell');
            el.id = id;
            gameBox.appendChild(el);
            cells.push(el)
            mark(el);
        }
        
        const createCells = () => {
            for (let i = 0; i < 9; i++) {
                createElement('div', i)
            }
        }

        const updateScore = () => {
            p1ScoreEl.textContent = p1Score;
            p2ScoreEl.textContent = p2Score;
        }

        // returns 'X', 'O', or null
        const getWinner = () => {
            for (const [a, b, c] of WINNING_LINES) {
                const m = cells[a].dataset.mark;
                if (m && m === cells[b].dataset.mark && m === cells[c].dataset.mark) {
                    return m;
                }
            }
            return null;
        }

        const isBoardFull = () => cells.every(cell => cell.dataset.mark);

        const resetBoard = () => {
            cells.forEach(cell => {
                cell.innerHTML = '';
                delete cell.dataset.mark;
            });
            currentPlayer = 'X';
            gameOver = false;
            heading.textContent = 'Score:';
        }

        const endRound = (winner) => {
            gameOver = true;
            if (winner === 'X') {
                p1Score++;
                heading.textContent = `${player1.textContent} wins!`;
            } else if (winner === 'O') {
                p2Score++;
                heading.textContent = `${player2.textContent} wins!`;
            } else {
                heading.textContent = "It's a draw!";
            }
            updateScore();
            setTimeout(resetBoard, 1500);   // start a new round after 1.5s
        }
        
        const mark = (cell) => {
            cell.addEventListener('click', () => {
                if (cell.dataset.mark || gameOver) return;
                cell.innerHTML = currentPlayer === 'X' ? X_ICON : O_ICON;
                cell.dataset.mark = currentPlayer
                const winner = getWinner()
                if (winner) endRound(winner);
                else if (isBoardFull()) endRound(winner);
                else currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            })
        }

        function playGame() {
            createCells()
            updateScore()
        }
        playGame();
    </script>
</body>
</html>
