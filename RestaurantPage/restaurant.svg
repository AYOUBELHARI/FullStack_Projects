<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="A plated dish on a table" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a3b1d"/><stop offset="1" stop-color="#a8552b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#wall)"/>
  <rect y="270" width="600" height="130" fill="#f4e6d0"/>
  <rect y="270" width="600" height="10" fill="#d9c3a0"/>
  <!-- hanging lamps -->
  <g fill="#f6c453">
    <path d="M110 0v60" stroke="#3b2314" stroke-width="3"/><path d="M80 90a30 30 0 0160 0z"/>
    <path d="M490 0v60" stroke="#3b2314" stroke-width="3"/><path d="M460 90a30 30 0 0160 0z"/>
  </g>
  <!-- steam -->
  <g fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="5" stroke-linecap="round">
    <path d="M270 150c-12-20 12-30 0-52"/><path d="M300 150c-12-20 12-30 0-52"/><path d="M330 150c-12-20 12-30 0-52"/>
  </g>
  <!-- plate -->
  <ellipse cx="300" cy="300" rx="190" ry="52" fill="#d8d2c8"/>
  <ellipse cx="300" cy="292" rx="190" ry="52" fill="#fffdf8"/>
  <ellipse cx="300" cy="292" rx="140" ry="36" fill="#f1ebe0"/>
  <!-- food -->
  <ellipse cx="300" cy="262" rx="85" ry="32" fill="#e9b45f"/>
  <ellipse cx="300" cy="252" rx="70" ry="24" fill="#f2c877"/>
  <g fill="#c9372c"><circle cx="268" cy="248" r="14"/><circle cx="302" cy="240" r="14"/><circle cx="334" cy="250" r="14"/></g>
  <g fill="#3f8a3d"><ellipse cx="285" cy="234" rx="16" ry="7" transform="rotate(-25 285 234)"/><ellipse cx="320" cy="232" rx="16" ry="7" transform="rotate(20 320 232)"/></g>
  <!-- cutlery -->
  <rect x="90" y="262" width="12" height="80" rx="5" fill="#b8bcc2"/>
  <rect x="500" y="262" width="12" height="80" rx="5" fill="#b8bcc2"/>
</svg>
