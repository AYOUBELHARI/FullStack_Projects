<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Application
    </title>
    <style>
        * { box-sizing: border-box; }
 
        body {
            margin: 0;
            font-family: Georgia, 'Times New Roman', serif;
            color: #3b2314;
            background: #fbf6ee;
            line-height: 1.6;
        }
 
        /* ---------- NAV ---------- */
        header { background: #7a3b1d; padding: 16px 8vw; }
        nav { display: flex; gap: 12px; flex-wrap: wrap; }
        nav button {
            font: inherit;
            padding: 8px 22px;
            border: 2px solid transparent;
            border-radius: 6px;
            background: transparent;
            color: #fbf6ee;
            cursor: pointer;
        }
        nav button:hover { border-color: #e9b45f; }
        nav button.active { background-color: #e9b45f; color: #3b2314; font-weight: bold; }
 
        /* ---------- CONTENT ---------- */
        #content { padding: 50px 8vw; max-width: 1100px; margin: 0 auto; }
        h1 { font-size: 2.4rem; line-height: 1.15; margin: 0 0 16px; }
        h2 { margin-top: 0; font-size: 2rem; }
 
        /* home */
        .hero {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: center;
        }
        .hero img { width: 100%; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.2); }
        .hero p { font-size: 1.1rem; margin: 0 0 14px; }
 
        /* menu */
        .menu { max-width: 700px; }
        .item { padding: 16px 0; border-bottom: 1px solid #e3d5bf; }
        .item h3 { margin: 0; }
        .item p { margin: 4px 0 0; color: #6b5444; }
        .item-head { display: flex; justify-content: space-between; gap: 16px; }
        .price { font-weight: bold; color: #c9372c; }
 
        /* about */
        .about { max-width: 700px; }
        .about p { margin: 0 0 14px; font-size: 1.1rem; }
        .about .info { background: white; border-left: 6px solid #e9b45f; padding: 16px 20px; border-radius: 6px; }
 
        @media (max-width: 800px) { .hero { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <script src="index.js" type="module"></script>
    <header>
        <nav>
            <button>Home</button>
            <button>Menu</button>
            <button>About</button>
        </nav>
    </header>
    <div id="content">
    </div>
</body>
</html>
